name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logistics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo, pdo_pgsql, session, tokenizer, xml
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: find app tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify driver API routes
        run: php artisan route:list --path=api/v1/driver
      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: logistics_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force
      - name: Run automated tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: logistics_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test
